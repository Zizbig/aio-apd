name: Build and Publish Base Docker Image

on:
  push:
    branches:
      - '**'
    paths:
      - 'Dockerfile.base'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

env:
  # Force all actions to run on Node 24 runtime to silence deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to allow GITHUB_TOKEN to publish packages to GHCR
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase Repo Name
        run: |
          # Convert GITHUB_REPOSITORY (e.g. Zizbig/aio-apd) to lowercase
          echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ env.REPO_NAME }}-base:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_NAME }}-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
